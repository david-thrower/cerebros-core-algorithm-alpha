apiVersion: batch/v1
kind: Job
metadata:
  name: cerebros-prepare-tokens
  namespace: cerebros
spec:
  template:
    spec:
      containers:
      - name: cerebros-prepare
        image: tensorflow/tensorflow:2.19.0-gpu
        command: ["/bin/sh"]
        args:
          - -c
          - |
            set -eu
            apt-get update && apt-get install -y git
            mkdir -p /app/src && cd /app/src
            git clone https://github.com/david-thrower/cerebros-core-algorithm-alpha.git .
            git fetch origin 208-refactor-nlp-example-to-tokenize-first
            git checkout 208-refactor-nlp-example-to-tokenize-first
            python -m pip install --upgrade pip
            PIP_BREAK_SYSTEM_PACKAGES=1 python -m pip install --no-cache-dir --break-system-packages -r requirements.txt
            PIP_BREAK_SYSTEM_PACKAGES=1 python -m pip install --no-cache-dir --break-system-packages -r cicd-requirements.txt
            PIP_BREAK_SYSTEM_PACKAGES=1 python -m pip install --no-cache-dir --break-system-packages mlflow transformers
            python tokenize_first_runner.py --mode prepare \
              --out /data/train_tokens.npz --max_len 128 \
              --tokenizer_checkpoint HuggingFaceTB/SmolLM3-3B
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-service:5000"
        - name: HF_HOME
          value: "/tmp/.cache/huggingface"
        - name: PIP_BREAK_SYSTEM_PACKAGES
          value: "1"
        volumeMounts:
        - name: data-storage
          mountPath: /data
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "2000m"
      restartPolicy: Never
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: cerebros-data-pvc
  backoffLimit: 2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cerebros-data-pvc
  namespace: cerebros
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi