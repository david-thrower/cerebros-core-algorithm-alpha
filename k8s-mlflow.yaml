apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-pvc
  namespace: cerebros
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: cerebros
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: python:3.11-slim
        command: ["/bin/sh"]
        args:
          - -c
          - |
            pip install mlflow==2.19.0 psycopg2-binary
            mlflow server \
              --backend-store-uri sqlite:///opt/mlflow/mlruns.db \
              --default-artifact-root /opt/mlflow/artifacts \
              --host 0.0.0.0 \
              --port 5000
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: mlflow-storage
          mountPath: /opt/mlflow
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://0.0.0.0:5000"
      volumes:
      - name: mlflow-storage
        persistentVolumeClaim:
          claimName: mlflow-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: cerebros
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
  type: NodePort