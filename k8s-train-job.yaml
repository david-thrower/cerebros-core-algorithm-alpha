apiVersion: batch/v1
kind: Job
metadata:
  name: cerebros-train
  namespace: cerebros
  labels:
    app: cerebros
    phase: train
spec:
  template:
    spec:
      containers:
      - name: cerebros-train
        image: tensorflow/tensorflow:2.19.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args:
          - -c
          - |
            set -eu
            apt-get update && apt-get install -y git
            mkdir -p /app/src && cd /app/src
            git clone https://github.com/david-thrower/cerebros-core-algorithm-alpha.git .
            git fetch origin 208-refactor-nlp-example-to-tokenize-first
            git checkout 208-refactor-nlp-example-to-tokenize-first
            python -m pip install --upgrade pip
            PIP_BREAK_SYSTEM_PACKAGES=1 python -m pip install --no-cache-dir --break-system-packages -r requirements.txt
            PIP_BREAK_SYSTEM_PACKAGES=1 python -m pip install --no-cache-dir --break-system-packages -r cicd-requirements.txt
            PIP_BREAK_SYSTEM_PACKAGES=1 python -m pip install --no-cache-dir --break-system-packages --ignore-installed blinker
            PIP_BREAK_SYSTEM_PACKAGES=1 python -m pip install --no-cache-dir --break-system-packages mlflow transformers
            python tokenize_first_runner.py --mode train \
              --cache /data/train_tokens.npz --epochs 1 --batch 8 --grad_accum 5 --mlflow_uri http://mlflow-service:5000 --print-sample
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-service:5000"
        - name: HF_HOME
          value: "/tmp/.cache/huggingface"
        - name: PIP_BREAK_SYSTEM_PACKAGES
          value: "1"
        volumeMounts:
        - name: data-storage
          mountPath: /data
        resources:
          requests:
            memory: "6Gi"
            cpu: "1500m"
          limits:
            memory: "12Gi"
            cpu: "3000m"
      restartPolicy: Never
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: cerebros-data-pvc
  backoffLimit: 2